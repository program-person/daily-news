<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily News</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; color: #1a1a1a; display: flex; height: 100vh; }

    /* サイドバー */
    #sidebar { width: 200px; background: #fff; border-right: 1px solid #e5e5e0; padding: 16px 0; overflow-y: auto; flex-shrink: 0; }
    #sidebar h1 { font-size: 13px; font-weight: 600; color: #888; padding: 0 16px 10px; letter-spacing: .05em; }
    .day-btn { display: block; width: 100%; text-align: left; padding: 9px 16px; background: none; border: none; cursor: pointer; font-size: 13px; color: #555; }
    .day-btn:hover { background: #f5f5f0; }
    .day-btn.active { background: #eef4ff; color: #2563eb; font-weight: 500; }

    /* メインエリア */
    #main { flex: 1; padding: 24px; overflow-y: auto; }
    #date-header { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
    #date-sub { font-size: 12px; color: #888; margin-bottom: 20px; }

    /* カテゴリラベル */
    .cat-label { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: #888; margin: 16px 0 6px; }

    /* 記事カード */
    .news-card { background: #fff; border: 1px solid #e5e5e0; border-radius: 8px; margin-bottom: 6px; cursor: pointer; transition: border-color .15s; }
    .news-card:hover { border-color: #bbb; }
    .news-card.open { border-color: #2563eb; }
    .card-header { padding: 10px 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card-title { font-size: 13px; font-weight: 500; line-height: 1.4; margin-bottom: 3px; }
    .card-src { font-size: 11px; color: #888; }
    .chevron { width: 16px; height: 16px; flex-shrink: 0; color: #aaa; transition: transform .2s; margin-top: 2px; }
    .news-card.open .chevron { transform: rotate(180deg); }

    /* 詳細エリア */
    .card-detail { max-height: 0; overflow: hidden; transition: max-height .25s ease; }
    .card-detail.open { max-height: 300px; }
    .detail-inner { padding: 0 12px 12px; border-top: 1px solid #e5e5e0; }
    .detail-summary { font-size: 13px; color: #444; line-height: 1.7; margin: 10px 0; }
    .detail-link { font-size: 12px; color: #2563eb; text-decoration: none; display: inline-flex; align-items: center; gap: 3px; }
    .detail-link:hover { text-decoration: underline; }

    /* バッジ */
    .badge { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 999px; margin-right: 5px; font-weight: 500; }
    .badge-tech { background: #dbeafe; color: #1e40af; }
    .badge-jp   { background: #d1fae5; color: #065f46; }
    .badge-world{ background: #fef3c7; color: #92400e; }
    .badge-new  { background: #dcfce7; color: #166534; }
    .badge-update{ background: #fee2e2; color: #991b1b; }

    /* 空状態 */
    #empty { color: #aaa; font-size: 14px; margin-top: 40px; text-align: center; }
    /* スマホ対応（画面幅600px以下） */
@media (max-width: 600px) {
  body {
    flex-direction: column; /* 横並び→縦並びに切り替え */
    height: auto;
    min-height: 100vh;
  }
  #sidebar {
    width: 100%;
    border-right: none;
    border-bottom: 1px solid #e5e5e0;
    padding: 0;
    display: flex;
    overflow-x: auto; /* 日付が多くなっても横スクロールできる */
    -webkit-overflow-scrolling: touch; /* iOSでの慣性スクロール有効化 */
  }
  #sidebar h1 {
    display: none; /* 「アーカイブ」の文字は狭いので非表示 */
  }
  .day-btn {
    flex-shrink: 0; /* タブが縮まないようにする */
    padding: 10px 14px;
    border-bottom: 2px solid transparent;
    white-space: nowrap; /* 日付が改行されないようにする */
  }
  .day-btn.active {
    background: none;
    border-bottom-color: #2563eb; /* 選択中タブに下線 */
    color: #2563eb;
  }
  #main {
    padding: 16px;
  }
}
  </style>
</head>
<body>

<nav id="sidebar">
  <h1>アーカイブ</h1>
  <div id="day-list"></div>
</nav>

<main id="main">
  <div id="date-header"></div>
  <div id="date-sub"></div>
  <div id="articles"></div>
  <div id="empty" style="display:none">記事がありません</div>
</main>

<script>
  // --- データ読み込み ---
  // dataフォルダにある全JSONを読み込んでサイドバーと記事一覧を生成する
  const DATA_FILES = ['2026-04-28.json'];  // ← あとでCoworkが自動更新する部分

  // カテゴリの表示順と名前の定義
  const CAT_ORDER = ['tech', 'jp', 'world'];
  const CAT_LABEL = { tech: 'Tech', jp: '国内', world: '海外' };
  const CAT_BADGE = { tech: 'badge-tech', jp: 'badge-jp', world: 'badge-world' };

  let allData = {};  // { "2026-04-27": [...記事配列] }

  // JSONファイルを全部fetch（取得）してallDataに格納する
  async function loadAll() {
    for (const file of DATA_FILES) {
      try {
        const res = await fetch(`data/${file}`);
        const json = await res.json();
        // ファイル名から日付キーを作る（例: 2026-04-27.json → 2026-04-27）
        const key = file.replace('.json', '');
        allData[key] = json.articles;
      } catch(e) {
        console.warn(`Failed to load ${file}`, e);
      }
    }
    buildSidebar();
  }

  // サイドバーの日付ボタンを生成する
  function buildSidebar() {
    const keys = Object.keys(allData).sort().reverse(); // 新しい日付が上
    const list = document.getElementById('day-list');
    list.innerHTML = '';
    keys.forEach((key, i) => {
      const btn = document.createElement('button');
      btn.className = 'day-btn' + (i === 0 ? ' active' : '');
      btn.textContent = formatDate(key);
      btn.onclick = () => {
        document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderArticles(key);
      };
      list.appendChild(btn);
    });
    if (keys.length > 0) renderArticles(keys[0]);
  }

  // 日付キーを読みやすい形式に変換（例: 2026-04-27 → 4月27日）
  function formatDate(key) {
    const [, m, d] = key.split('-');
    return `${parseInt(m)}月${parseInt(d)}日`;
  }

  // 選択した日の記事一覧を描画する
  function renderArticles(key) {
    const articles = allData[key] || [];
    document.getElementById('date-header').textContent = `${key.replace(/-/g, '/')}`;
    document.getElementById('date-sub').textContent = `${articles.length}件`;
    document.getElementById('empty').style.display = articles.length === 0 ? 'block' : 'none';

    const container = document.getElementById('articles');
    container.innerHTML = '';

    // カテゴリごとにグループ化して表示
    CAT_ORDER.forEach(cat => {
      const items = articles.filter(a => a.category === cat);
      if (items.length === 0) return;

      // カテゴリラベル
      const label = document.createElement('div');
      label.className = 'cat-label';
      label.innerHTML = `<span class="badge ${CAT_BADGE[cat]}">${CAT_LABEL[cat]}</span>`;
      container.appendChild(label);

      // 記事カード
      items.forEach(article => container.appendChild(createCard(article)));
    });
  }

  // 1枚の記事カードを生成して返す
  function createCard(article) {
    const card = document.createElement('div');
    card.className = 'news-card';
    card.innerHTML = `
      <div class="card-header">
        <div>
          <div class="card-title">
            <span class="badge ${article.tag === 'update' ? 'badge-update' : 'badge-new'}">
              ${article.tag === 'update' ? '続報' : '新着'}
            </span>
            ${article.title}
          </div>
          <div class="card-src">${article.source} · ${article.time}</div>
        </div>
        <svg class="chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M4 6l4 4 4-4"/>
        </svg>
      </div>
      <div class="card-detail">
        <div class="detail-inner">
          <div class="detail-summary">${article.summary}</div>
          <a class="detail-link" href="${article.url}" target="_blank">
            元記事を読む
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <path d="M2 10L10 2M5 2h5v5"/>
            </svg>
          </a>
        </div>
      </div>
    `;
    // タップで詳細を開閉する
    card.onclick = () => {
      const isOpen = card.classList.contains('open');
      document.querySelectorAll('.news-card.open').forEach(c => {
        c.classList.remove('open');
        c.querySelector('.card-detail').classList.remove('open');
      });
      if (!isOpen) {
        card.classList.add('open');
        card.querySelector('.card-detail').classList.add('open');
      }
    };
    return card;
  }

  loadAll();
</script>
</body>
</html>
